			shellPath = /bin/bash;
			shellScript = "# Platform: Sparkle ships its helpers ad-hoc signed, and embedding re-signs\n# only the framework's own binary, so the notary service rejects the app.\n# Scriber is not sandboxed, so Sparkle runs in process and never uses its XPC\n# services: they are removed rather than signed.\nset -euo pipefail\n[ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ] || exit 0\nFRAMEWORK=\"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/Sparkle.framework\"\nif [ ! -d \"$FRAMEWORK\" ]; then\n  echo \"error: Sparkle.framework is not embedded yet; this phase must run after it is\"\n  exit 1\nfi\nrm -rf \"$FRAMEWORK/Versions/B/XPCServices\" \"$FRAMEWORK/XPCServices\"\nfor item in \"$FRAMEWORK/Versions/B/Autoupdate\" \"$FRAMEWORK/Versions/B/Updater.app\" \"$FRAMEWORK\"; do\n  codesign --force --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" --options runtime ${OTHER_CODE_SIGN_FLAGS:-} \"$item\"\ndone\n";
